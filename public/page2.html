            --lumipay-red: #E30613;          /* Red signature color */
            --lumipay-red-dark: #b8000b;
            --lumipay-green: #008738;        /* Green accent color */
            --lumipay-dark: #121212;
            --bg-color: #f5f5f5;
            --card-bg: #ffffff;
            --text-main: #111111;
            --text-muted: #666666;
            --input-border: #e0e0e0;
            --input-focus: #E30613;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Top Header Navigation Bar - LumiPAY Red */
        .app-header {
            width: 100%;
            background-color: var(--lumipay-red);
            height: 60px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(227, 6, 19, 0.2);
        }

        .back-btn {
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .header-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        .header-title .region {

            font-size: 11px;
            margin-left: 6px;
            font-weight: 800;
            text-transform: uppercase;
            background: var(--lumipay-green);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .menu-icon {
            font-size: 24px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .menu-icon span {
            display: block;
            width: 22px;
            height: 3px;
            background-color: #ffffff;
            border-radius: 2px;
        }
