<!DOCTYPE html>
<html lang="rn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LumiPAY Burundi - Gusaba Ingurane</title>

    <!-- ✅ Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            /* LumiPAY Brand Colors */
            --lumipay-red: #E30613;          /* Red signature color */
            --lumipay-red-dark: #b8000b;
            --lumipay-green: #008738;        /* Green accent color */
            --lumipay-dark: #121212;
            --bg-color: #f5f5f5;
            --card-bg: #ffffff;
            --text-main: #111111;
            --text-muted: #666666;
            --input-border: #e0e0e0;
            --input-focus: #E30613;
            --btn-gray: #f0f2f5;
            --btn-gray-text: #444444;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Top Header Navigation Bar - LumiPAY Red */
        .app-header {
            width: 100%;
            background-color: var(--lumipay-red);
            height: 60px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(227, 6, 19, 0.2);
        }

        .back-btn-top {
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .header-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        .header-title .region {
            color: #ffffff;
            font-size: 11px;
            margin-left: 6px;
            font-weight: 800;
            text-transform: uppercase;
            background: var(--lumipay-green);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .menu-icon {
            font-size: 24px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .menu-icon span {
            display: block;
            width: 22px;
            height: 3px;
            background-color: #ffffff;
            border-radius: 2px;
        }

        /* Card Layout */
        .card {
            background: var(--card-bg);
            width: 90%;
            max-width: 440px;
            margin: 20px 0 30px;
            padding: 32px 24px;
            border-radius: 20px;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.05);
            border: 1px solid #f0f0f0;
            display: flex;
            flex-direction: column;
        }

        .main-title {
            font-size: 25px;
            color: var(--text-main);
            margin: 0 0 6px;
            text-align: center;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .subtext {
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 24px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Step Progress Bar */
        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 0 auto 32px;
            width: 100%;
        }

        .step-bar {
            flex: 1;
            height: 6px;
            background-color: #e2e8f0;
            border-radius: 3px;
        }

        .step-bar.active {
            background-color: var(--lumipay-red);
        }

        /* Form Inputs */
        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .form-control {
            font-size: 15px;
            padding: 14px 16px;
            border: 2px solid var(--input-border);
            border-radius: 10px;
            background-color: #ffffff;
            color: #111111;
            outline: none;
            width: 100%;
            transition: border-color 0.2s;
        }

        .form-control::placeholder {
            color: #a0aec0;
        }

        .form-control:focus {
            border-color: var(--lumipay-red);
        }

        /* Phone Input Group */
        .phone-group {
            display: flex;
            gap: 10px;
        }

        .country-prefix {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background-color: #f0f8f2;
            border: 2px solid #d8ebd2;
            border-radius: 10px;
            padding: 0 14px;
            font-weight: 700;
            font-size: 15px;
            color: var(--text-main);
            white-space: nowrap;
        }

        .flag-icon {
            font-size: 18px;
            line-height: 1;
        }

        .phone-hint {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 8px;
        }

        /* Buttons Container */
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        .btn-prev {
            background-color: var(--btn-gray);
            color: var(--btn-gray-text);
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: background-color 0.2s;
        }

        .btn-prev:hover {
            background-color: #e2e6ea;
        }

        .btn-next {
            background-color: var(--lumipay-red);
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(227, 6, 19, 0.35);
        }

        .btn-next:active {
            background-color: var(--lumipay-red-dark);
            transform: scale(0.99);
        }

        /* Footer Banner */
        .footer-banner {
            width: 100%;
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: #666666;
            margin-top: auto;
        }
    </style>
</head>

<body>

<!-- LumiPAY Red Header Navigation Bar -->
<div class="app-header">
    <a onclick="goBack()" class="back-btn-top">← Gusubira</a>
    <div class="header-title">
        <span>LumiPAY</span><span class="region">Burundi</span>
    </div>
    <div class="menu-icon">
        <span></span>
        <span></span>
        <span></span>
    </div>
</div>

<div class="card">
    <h1 class="main-title">Gusaba Ingurane</h1>
    <div class="subtext">Intambwe ya 2 kuri 3</div>

    <!-- Step Bar Progress Indicators (Steps 1 & 2 Active) -->
    <div class="step-indicator">
        <div class="step-bar active"></div>
        <div class="step-bar active"></div>
        <div class="step-bar"></div>
    </div>

    <!-- Personal Info Form -->
    <form id="step2Form" onsubmit="goNext(event)">
        <div class="form-group">
            <label for="firstName">Izina ry'Ise</label>
            <input type="text" id="firstName" class="form-control" placeholder="Arakaza" required>
        </div>

        <div class="form-group">
            <label for="lastName">Izina ry'Nyina</label>
            <input type="text" id="lastName" class="form-control" placeholder="Jean" required>
        </div>

        <div class="form-group">
            <label for="email">Imeyili (Email)</label>
            <input type="email" id="email" class="form-control" placeholder="jean.arakaza@example.bi" required>
        </div>

        <div class="form-group">
            <label for="phone">Numero ya Telefone LumiCash / Lumitel</label>
            <div class="phone-group">
                <div class="country-prefix">
                    <span class="flag-icon">🇧🇮</span>
                    <span>+257</span>
                </div>
                <input type="tel" id="phone" class="form-control" placeholder="61123456" maxlength="8" pattern="[0-9]{8}" required>
            </div>
            <div class="phone-hint">Imibare 8 (akarorero: 61123456)</div>
        </div>

        <div class="btn-container">
            <button type="button" class="btn-prev" onclick="goBack()">INYUUMA</button>
            <button type="submit" class="btn-next">KOMEZA</button>
        </div>
    </form>
</div>

<!-- Footer -->
<div class="footer-banner">
    © 2026 LumiPAY Burundi - Lumitel
</div>

<script>
    window.onload = () => {
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // Auto-fill existing saved user info
        const fName = localStorage.getItem('firstName');
        const lName = localStorage.getItem('lastName');
        const email = localStorage.getItem('email');
        const phone = localStorage.getItem('phone');

        if (fName) document.getElementById('firstName').value = fName;
        if (lName) document.getElementById('lastName').value = lName;
        if (email) document.getElementById('email').value = email;
        if (phone) document.getElementById('phone').value = phone;
    };

    function goNext(event) {
        event.preventDefault();

        const fName = document.getElementById('firstName').value.trim();
        const lName = document.getElementById('lastName').value.trim();
        const email = document.getElementById('email').value.trim();
        const phone = document.getElementById('phone').value.trim();

        if (!fName || !lName || !email || !phone) {
            alert("Nyamuneka uzuze ibibanza vyose.");
            return;
        }

        if (!/^\d{8}$/.test(phone)) {
            alert("Nyamuneka injiza numero y'imibare 8 y'ukuri.");
            return;
        }

        // Save stored details
        localStorage.setItem('firstName', fName);
        localStorage.setItem('lastName', lName);
        localStorage.setItem('email', email);
        localStorage.setItem('phone', phone);
        
        // Save phone specifically for API verification
        localStorage.setItem('userPhone', phone);

        window.location.href = "/page4";
    }

    function goBack() {
        window.location.href = "/page2";
    }
</script>

</body>
</html>
